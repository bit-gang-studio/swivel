name: Live view check

on:
  workflow_dispatch:
    inputs:
      bench:
        description: Run the frame rate benchmark too
        type: boolean
        default: true

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/patch-firefox.mjs
      - if: inputs.bench
        run: node --experimental-strip-types --no-warnings scripts/bench-live.mjs
      - if: inputs.bench
        run: node --experimental-strip-types --no-warnings scripts/bench-live.mjs
        env:
          SIZE: 390x844
      - run: npm run build
      - name: Native self-test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: SWIVEL_SELFTEST=1 SWIVEL_HIDDEN=1 xvfb-run -a npx electron . --no-sandbox
      - name: Native self-test
        if: runner.os != 'Linux'
        timeout-minutes: 3
        shell: bash
        run: SWIVEL_SELFTEST=1 SWIVEL_HIDDEN=1 npx electron .
      - name: Real clicks (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 4
        run: SWIVEL_CLICKTEST=1 npx electron .
      - name: Visual check (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 7
        run: SWIVEL_VISUAL=screenshots npx electron .
      - name: Visual check (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 7
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          SWIVEL_VISUAL=screenshots xvfb-run -a -s "-screen 0 1440x960x24" npx electron . --no-sandbox
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Windows'
        with:
          name: screenshots-${{ runner.os }}
          path: |
            screenshots/
            ~/Library/Logs/swivel/
          if-no-files-found: ignore
      - name: App test (Linux)
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/e2e-live.mjs
        env:
          SWIVEL_DEBUG: '1'
      - name: User agents match real browsers (Linux)
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/e2e-useragent.mjs
      - name: User agents match real browsers
        timeout-minutes: 5
        if: runner.os != 'Linux'
        run: node scripts/e2e-useragent.mjs
      - name: Window data isolation (Linux)
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/e2e-isolation.mjs
        env:
          SWIVEL_DEBUG: '1'
      - name: App test
        timeout-minutes: 8
        if: runner.os != 'Linux'
        run: node scripts/e2e-live.mjs
        env:
          SWIVEL_DEBUG: '1'
      - name: Window data isolation
        timeout-minutes: 5
        if: runner.os != 'Linux'
        run: node scripts/e2e-isolation.mjs
        env:
          SWIVEL_DEBUG: '1'
      - name: File uploads and downloads (Linux)
        timeout-minutes: 5
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: xvfb-run -a node scripts/e2e-files.mjs
        env:
          SWIVEL_DEBUG: '1'
      - name: File uploads and downloads
        timeout-minutes: 5
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: node scripts/e2e-files.mjs
        env:
          SWIVEL_DEBUG: '1'
      - name: Sign-in popups (Linux)
        timeout-minutes: 5
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: xvfb-run -a node scripts/e2e-popup.mjs
        env:
          SWIVEL_DEBUG: '1'
      - name: Sign-in popups
        timeout-minutes: 5
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: node scripts/e2e-popup.mjs
        env:
          SWIVEL_DEBUG: '1'
