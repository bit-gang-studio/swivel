name: Live view check

on:
  workflow_dispatch:
    inputs:
      bench:
        description: Run the frame rate benchmark too
        type: boolean
        default: true

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - if: inputs.bench
        run: node --experimental-strip-types --no-warnings scripts/bench-live.mjs
      - if: inputs.bench
        run: node --experimental-strip-types --no-warnings scripts/bench-live.mjs
        env:
          SIZE: 390x844
      - run: npm run build
      - name: App test (Linux)
        timeout-minutes: 8
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/e2e-live.mjs
      - name: App test
        timeout-minutes: 8
        if: runner.os != 'Linux'
        run: node scripts/e2e-live.mjs
